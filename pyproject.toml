[project]
name = "transcriber"
version = "0.1.0"
description = "Local meeting transcription and diarization application"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
    "sqlalchemy==2.0.49",
    "pydantic-settings==2.14.0",
    "python-multipart==0.0.27",
    "aiofiles==25.1.0",
    "pyannote.audio==4.0.4",
    "speechbrain==1.1.0",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "soundfile==0.13.1",
    "numpy==2.4.4",
    "scipy==1.17.1",
    "python-docx==1.2.0",
    "reportlab==4.5.0",
    "faster-whisper==1.2.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]
postgres-migration = ["psycopg2-binary==2.9.12"]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = [
    "model_load: loads locally installed speech models",
    "model_inference: runs local speech models against audio",
]
