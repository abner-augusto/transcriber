[check]
command = "bash scripts/check"

[tracker]
kind = "local"

[autonomy]
merge = "main"
push = true

[quality]
include = ["**/*.py", "frontend/src/**/*.ts", "frontend/src/**/*.tsx"]
exclude = []
max_file_lines = 300
max_function_lines = 40
max_crap = 30
docstrings = false
coverage = "coverage.json"
baseline = "docs/agents/quality-baseline.json"
